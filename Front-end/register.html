<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racik Rasa - Pendaftaran Akun</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>

  <div class="register-container">
    <a class="auth-back" href="index.html" aria-label="Kembali ke halaman utama" title="Kembali ke halaman utama">
      <img src="assets/figma/detail-back.png" alt="">
    </a>
    
    <!-- Brand Logo -->
    <div class="brand-logo-wrapper">
      <img src="assets/logo-racik-rasa.png" alt="Racik Rasa Logo" class="brand-logo-img">
    </div>

    <h1 class="register-title">DAFTAR</h1>

    <form id="registerForm" class="register-form" novalidate>
      
      <!-- Nama -->
      <div class="form-group">
        <label for="registerNama">NAMA</label>
        <div class="input-wrapper">
          <input type="text" id="registerNama" autocomplete="name" />
        </div>
        <span class="error-message"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="registerEmail">EMAIL</label>
        <div class="input-wrapper">
          <input type="email" id="registerEmail" autocomplete="email" />
        </div>
        <span class="error-message"></span>
      </div>

      <!-- Kata Sandi -->
      <div class="form-group">
        <label for="registerSandi">KATA SANDI</label>
        <div class="input-wrapper">
          <input type="password" id="registerSandi" autocomplete="new-password" />
          <button type="button" class="toggle-password" data-target="registerSandi" title="Tampilkan/Sembunyikan Sandi">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="error-message"></span>
      </div>

      <!-- Konfirmasi Kata Sandi -->
      <div class="form-group">
        <label for="registerKonfirmasi">KONFIRMASI KATA SANDI</label>
        <div class="input-wrapper">
          <input type="password" id="registerKonfirmasi" autocomplete="new-password" />
          <button type="button" class="toggle-password" data-target="registerKonfirmasi" title="Tampilkan/Sembunyikan Sandi">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="error-message"></span>
      </div>

      <button type="submit" id="btnDaftar" class="btn-submit-daftar">DAFTAR</button>
    </form>

    <div class="divider-container">
      <span class="divider-text">Atau Masuk Dengan</span>
    </div>

    
        <!-- Google Button -->
    <button type="button" class="btn-google-login" title="Masuk dengan Google">
      <img class="google-icon-svg" src="assets/figma/logo-google.svg" alt="Google" />
    </button>

    <div class="login-link-wrapper">
      Sudah Punya Akun? <a href="login.html" class="login-redirect-link">MASUK</a>
    </div>

    <dialog class="register-notice-dialog" id="register-notice-dialog" aria-labelledby="register-notice-message">
      <div class="register-notice-card">
        <p id="register-notice-message"></p>
      </div>
      <button class="register-notice-button" id="register-notice-dismiss" type="button">Oke, Mengerti</button>
    </dialog>

  </div>

  <script type="module" src="js/modules/register.js"></script>
</body>
</html>
