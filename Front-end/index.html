<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temukan inspirasi resep dari bahan yang tersedia di dapur."
    />
    <title>Racik Rasa - Cari Resep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      
      <header class="search-panel">
        <div class="panel-heading">
          <h1 class="section-label">Cari Berdasarkan Bahan Yukk!</h1>
          <a class="brand" href="#" aria-label="Racik Rasa">
            <img src="assets/figma/persona-racik-rasa.png" alt="Racik Rasa" />
            <img class="brand-accent" src="assets/figma/logo-vector.svg" alt="" />
          </a>
        </div>

        <form class="ingredient-search" id="ingredient-search">
          <div class="search-field">
            <label class="sr-only" for="main-ingredient">Bahan utama</label>
            <input
              id="main-ingredient"
              name="bahan-utama"
              type="search"
              placeholder="Masukan Bahan Utama (contoh: ayam)"
              title="Masukkan maksimal lima bahan, pisahkan dengan koma."
              autocomplete="off"
            />
            <button
              class="microphone-button"
              type="button"
              data-voice-target="main-ingredient"
              aria-label="Masukkan bahan utama dengan suara"
              aria-pressed="false"
              title="Masukkan bahan utama dengan suara"
            >
                <img class="field-icon" src="assets/figma/microphone.svg" alt="" />
            </button>
          </div>
          <div class="ingredient-row">
            <div class="search-field">
              <label class="sr-only" for="additional-ingredients">Bahan tambahan</label>
              <input
                id="additional-ingredients"
                name="bahan-tambahan"
                type="search"
                placeholder="Masukan Bahan Tambahan (contoh: tempe, tahu, kol)"
                autocomplete="off"
              />
              <button
                class="microphone-button"
                type="button"
                data-voice-target="additional-ingredients"
                aria-label="Masukkan bahan tambahan dengan suara"
                aria-pressed="false"
                title="Masukkan bahan tambahan dengan suara"
              >
                  <img class="field-icon" src="assets/figma/microphone.svg" alt="" />
              </button>
            </div>
            <span
              class="ingredient-count"
              id="ingredient-count"
              role="status"
              aria-live="polite"
              aria-label="0 dari maksimal 5 bahan tambahan"
              >0/5</span
            >
          </div>
          <button class="button button-primary mix-button" type="submit">
            Racik Resep Sekarang!
          </button>
        </form>

        <form class="recipe-search" id="recipe-search">
          <label class="section-label" for="recipe-query">Cari Resep Langsung Yukk!</label>
          <div class="recipe-search-row">
            <div class="search-field recipe-query-field">
              <input
                id="recipe-query"
                name="resep"
                type="search"
                placeholder="Cari Nama Resep Langsung  (Contoh: Nasi Goreng)"
                autocomplete="off"
              />
              <button
                class="microphone-button"
                type="button"
                data-voice-target="recipe-query"
                aria-label="Cari resep dengan suara"
                aria-pressed="false"
                title="Cari resep dengan suara"
              >
                  <img class="field-icon" src="assets/figma/microphone.svg" alt="" />
              </button>
            </div>
            <button class="icon-button search-button" type="submit" aria-label="Cari resep">
              <img src="assets/figma/search.svg" alt="" />
            </button>
          </div>
          <button
            class="button button-filter"
            type="button"
            id="filter-button"
            aria-expanded="false"
            aria-controls="filter-panel"
          >
            FILTER
          </button>
        </form>
        <section class="filter-panel" id="filter-panel" aria-label="Filter resep" hidden>
          <section class="filter-group" role="group" aria-labelledby="filter-allergen-title">
            <h2 class="filter-group-title" id="filter-allergen-title">Filter Alergen</h2>
            <div class="filter-options filter-options-allergens">
              <label class="filter-option" for="filter-egg">
                <input id="filter-egg" type="checkbox" value="egg" />
                <span>Telur</span>
              </label>
              <label class="filter-option" for="filter-seafood">
                <input id="filter-seafood" type="checkbox" value="seafood" />
                <span>Seafood</span>
              </label>
              <label class="filter-option" for="filter-nuts">
                <input id="filter-nuts" type="checkbox" value="nuts" />
                <span>kacang</span>
              </label>
            </div>
          </section>
          <section class="filter-group" role="group" aria-labelledby="filter-preference-title">
            <h2 class="filter-group-title" id="filter-preference-title">Pilihan Alergen</h2>
            <div class="filter-options filter-options-preferences">
              <label class="filter-option" for="filter-chili-free">
                <input id="filter-chili-free" type="checkbox" value="chili" />
                <span>Bebas Cabai</span>
              </label>
              <label class="filter-option" for="filter-pepper-free">
                <input id="filter-pepper-free" type="checkbox" value="pepper" />
                <span>Bebas Lada</span>
              </label>
            </div>
          </section>
        </section>
      </header>

      <main class="recipe-content">
        <section class="recipe-grid" id="recipe-grid" aria-label="Daftar resep"></section>
        <p class="empty-state" id="empty-state" hidden>Resep tidak ditemukan.</p>
        <nav class="pagination" aria-label="Halaman resep">
          <button class="page-button is-current" type="button" aria-current="page">1</button>
          <button class="page-button" type="button">2</button>
          <button class="page-button" type="button">3</button>
          <span class="page-more">...</span>
        </nav>
      </main>

      <nav class="bottom-nav" aria-label="Navigasi utama">
        <a class="nav-item is-active" href="#" aria-label="Beranda" aria-current="page">
          <span class="sr-only">Beranda</span>
        </a>
        <a class="nav-item" href="#" aria-label="Resep tersimpan">
          <span class="sr-only">Resep tersimpan</span>
        </a>
        <a class="nav-item" href="#" aria-label="Profil">
          <span class="sr-only">Profil</span>
        </a>
      </nav>

      <dialog class="validation-dialog" id="validation-dialog" aria-labelledby="validation-message">
        <p id="validation-message">Harap masukkan minimal satu bahan utama</p>
        <button class="button validation-dialog-button" type="button" autofocus>
          Oke, Mengerti
        </button>
      </dialog>
    </div>
  </body>
</html>
