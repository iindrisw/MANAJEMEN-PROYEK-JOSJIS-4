<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Temukan inspirasi resep dari bahan yang tersedia di dapur."
    />
    <title>Racik Rasa - Cari Resep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/search.css" />
    <link rel="stylesheet" href="css/recipes.css" />
    <link rel="stylesheet" href="css/recipe-detail.css" />
    <link rel="stylesheet" href="css/views.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      
      <header class="search-panel">
        <div class="panel-heading">
          <h1 class="section-label">Cari Berdasarkan Bahan Yukk!</h1>
          <a class="brand" href="#" aria-label="Racik Rasa">
            <img src="assets/figma/persona-racik-rasa.png" alt="Racik Rasa" />
            <img class="brand-accent" src="assets/figma/logo-vector.svg" alt="" />
          </a>
          <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="Buka navigasi"
            aria-expanded="false"
            aria-controls="bottom-nav"
          >
            <img src="assets/figma/menu.svg" alt="" />
          </button>
        </div>

        <form class="ingredient-search" id="ingredient-search">
          <div class="search-field">
            <label class="sr-only" for="main-ingredient">Bahan utama</label>
            <input
              id="main-ingredient"
              name="bahan-utama"
              type="search"
              placeholder="Masukan Bahan Utama (contoh: ayam)"
              title="Masukkan maksimal lima bahan, pisahkan dengan koma."
              autocomplete="off"
            />
            <button
              class="microphone-button"
              type="button"
              data-voice-target="main-ingredient"
              aria-label="Masukkan bahan utama dengan suara"
              aria-pressed="false"
              title="Masukkan bahan utama dengan suara"
            >
                <img class="field-icon" src="assets/figma/microphone.svg" alt="" />
            </button>
          </div>
          <div class="ingredient-row">
            <div class="search-field">
              <label class="sr-only" for="additional-ingredients">Bahan tambahan</label>
              <input
                id="additional-ingredients"
                name="bahan-tambahan"
                type="search"
                placeholder="Masukan Bahan Tambahan (contoh: tempe, tahu, kol)"
                autocomplete="off"
              />
              <button
                class="microphone-button"
                type="button"
                data-voice-target="additional-ingredients"
                aria-label="Masukkan bahan tambahan dengan suara"
                aria-pressed="false"
                title="Masukkan bahan tambahan dengan suara"
              >
                  <img class="field-icon" src="assets/figma/microphone.svg" alt="" />
              </button>
            </div>
            <span
              class="ingredient-count"
              id="ingredient-count"
              role="status"
              aria-live="polite"
              aria-label="0 dari maksimal 5 bahan tambahan"
              >0/5</span
            >
          </div>
          <button class="button button-primary mix-button" type="submit">
            Racik Resep Sekarang!
          </button>
        </form>

        <form class="recipe-search" id="recipe-search">
          <label class="section-label" for="recipe-query">Cari Resep Langsung Yukk!</label>
          <div class="recipe-search-row">
            <div class="search-field recipe-query-field">
              <input
                id="recipe-query"
                name="resep"
                type="search"
                placeholder="Cari Nama Resep Langsung  (Contoh: Nasi Goreng)"
                autocomplete="off"
              />
              <button
                class="microphone-button"
                type="button"
                data-voice-target="recipe-query"
                aria-label="Cari resep dengan suara"
                aria-pressed="false"
                title="Cari resep dengan suara"
              >
                  <img class="field-icon" src="assets/figma/microphone.svg" alt="" />
              </button>
            </div>
            <button class="icon-button search-button" type="submit" aria-label="Cari resep">
              <img src="assets/figma/search.svg" alt="" />
            </button>
          </div>
          <button
            class="button button-filter"
            type="button"
            id="filter-button"
            aria-expanded="false"
            aria-pressed="false"
            aria-controls="filter-panel"
          >
            FILTER
          </button>
        </form>
        <section
          class="filter-panel"
          id="filter-panel"
          aria-label="Filter resep"
          aria-hidden="true"
          inert
          hidden
        >
          <div class="filter-panel-background" aria-hidden="true"></div>
          <section class="filter-group" role="group" aria-labelledby="filter-allergen-title">
            <h2 class="filter-group-title" id="filter-allergen-title">Pilihan Alergen</h2>
            <div class="filter-options filter-options-allergens">
              <label class="filter-option" for="filter-egg">
                <input id="filter-egg" type="checkbox" value="egg" />
                <span>Telur</span>
              </label>
              <label class="filter-option" for="filter-seafood">
                <input id="filter-seafood" type="checkbox" value="seafood" />
                <span>Seafood</span>
              </label>
              <label class="filter-option" for="filter-nuts">
                <input id="filter-nuts" type="checkbox" value="nuts" />
                <span>Kacang</span>
              </label>
            </div>
          </section>
          <section class="filter-group" role="group" aria-labelledby="filter-preference-title">
            <h2 class="filter-group-title" id="filter-preference-title">Bebas Pedas</h2>
            <div class="filter-options filter-options-preferences">
              <label class="filter-option" for="filter-chili-free">
                <input id="filter-chili-free" type="checkbox" value="chili" />
                <span>Bebas Cabai</span>
              </label>
              <label class="filter-option" for="filter-pepper-free">
                <input id="filter-pepper-free" type="checkbox" value="pepper" />
                <span>Bebas Laba</span>
              </label>
            </div>
          </section>
          <button
            class="filter-close"
            id="filter-close"
            type="button"
            aria-label="Tutup filter"
            title="Tutup filter"
          >
            <span>X</span>
          </button>
          <button class="filter-apply" id="filter-apply" type="button">
            <span>Terapkan Filter</span>
          </button>
        </section>
      </header>

      <section
        class="recipe-detail"
        id="recipe-detail"
        aria-label="Detail resep"
        hidden
      >
        <header class="detail-hero">
          <button class="detail-back" id="detail-back" type="button" aria-label="Kembali ke daftar resep">
            <img src="assets/figma/detail-back.png" alt="" />
          </button>
          <h1 class="detail-page-title">DETAIL RESEP</h1>
          <button class="detail-action detail-like" id="detail-like" type="button" aria-label="Sukai resep" aria-pressed="false">
            <img src="assets/figma/detail-heart.svg" alt="" />
          </button>
          <h2 class="detail-recipe-title" id="detail-recipe-title">Memuat resep...</h2>
          <button class="detail-action detail-bookmark" id="detail-bookmark" type="button" aria-label="Simpan resep" aria-pressed="false">
            <img src="assets/figma/detail-bookmark.svg" alt="" />
          </button>
        </header>

        <div class="detail-body">
          <p class="detail-feedback" id="detail-feedback" role="status" aria-live="polite" hidden></p>
          <section class="detail-ingredient-section" id="detail-missing-section">
            <h2 class="detail-section-title" id="detail-missing-title">Bahan tidak tersedia:</h2>
            <div class="detail-ingredient-card">
              <ul class="detail-ingredient-list" id="detail-missing-list"></ul>
              <button class="detail-copy" type="button" data-copy-list="detail-missing-list" aria-label="Salin bahan tidak tersedia">
                <span>SALIN</span>
                <img src="assets/figma/detail-copy.svg" alt="" />
              </button>
            </div>
          </section>

          <section class="detail-ingredient-section" id="detail-available-section">
            <h2 class="detail-section-title" id="detail-available-title">Bahan tersedia:</h2>
            <div class="detail-ingredient-card">
              <ul class="detail-ingredient-list" id="detail-available-list"></ul>
              <button class="detail-copy" type="button" data-copy-list="detail-available-list" aria-label="Salin bahan tersedia">
                <span>SALIN</span>
                <img src="assets/figma/detail-copy.svg" alt="" />
              </button>
            </div>
          </section>
        </div>

        <img class="detail-scrollbar" src="assets/figma/detail-scroll.svg" alt="" aria-hidden="true" />
        <footer class="detail-footer">
          <button class="detail-steps-button" id="detail-steps" type="button">
            LIHAT LANGKAH - LANGKAH
          </button>
        </footer>
      </section>

      <main class="recipe-content">
        <section class="recipe-grid" id="recipe-grid" aria-label="Daftar resep"></section>
        <p class="empty-state" id="empty-state" hidden>Resep tidak ditemukan.</p>
        <nav class="pagination" aria-label="Halaman resep">
          <button class="page-button is-current" type="button" aria-current="page">1</button>
          <button class="page-button" type="button">2</button>
          <button class="page-button" type="button">3</button>
          <span class="page-more">...</span>
        </nav>
      </main>

      <button
        class="drawer-backdrop"
        id="drawer-backdrop"
        type="button"
        aria-label="Tutup menu"
        aria-hidden="true"
        inert
        hidden
      ></button>
      <nav
        class="menu-drawer"
        id="bottom-nav"
        aria-label="Navigasi utama"
        aria-hidden="true"
        inert
        hidden
      >
        <a class="drawer-signup" href="#" data-menu-link>Daftar atau Masuk</a>
        <div class="drawer-links">
          <a class="drawer-link is-active" href="#" aria-current="page" data-menu-link>
            <img src="assets/figma/drawer-home.svg" alt="" />
            <span>HOME</span>
          </a>
          <a class="drawer-link" href="#" data-menu-link>
            <img src="assets/figma/drawer-bookmark.svg" alt="" />
            <span>BOOKMARK</span>
          </a>
          <a class="drawer-link" href="#" data-menu-link>
            <img src="assets/figma/drawer-profile.svg" alt="" />
            <span>PROFIL</span>
          </a>
        </div>
      </nav>
     <!-- Ganti dialog langkah memasak yang lama dengan section ini -->
      <section class="recipe-steps-screen" id="recipe-steps-screen" aria-label="Langkah Memasak" hidden>
        <header class="steps-screen-header">
          <button class="steps-back-button" id="steps-back" type="button" aria-label="Kembali ke detail resep">
            <img src="assets/figma/detail-back.png" alt="" />
          </button>
          <h1>Langkah Memasak</h1>
        </header>
        
        <div class="steps-screen-body">
          <ol class="recipe-steps-list" id="recipe-steps-list">
            <!-- Daftar langkah memasak akan dimuat secara dinamis di sini -->
          </ol>
        </div>
      </section>
    </div>
  </body>
</html>
