openapi: 3.0.3
info:
  title: API Documentation — Racik Rasa
  description: Dokumentasi resmi API Racik Rasa mencakup modul pencarian & katalog resep, detail & interaksi resep, autentikasi pengguna, dan profil pengguna.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Server Local Development

tags:
  - name: Modul Pencarian & Katalog Resep
    description: Endpoint untuk pencarian, filter, dan resep terpopuler.
  - name: Modul Detail & Interaksi Resep
    description: Endpoint detail resep dan pengelolaan bookmark.
  - name: Modul Autentikasi Pengguna
    description: Endpoint pendaftaran, login (manual & Google), dan logout.
  - name: Modul Profil Pengguna
    description: Endpoint informasi profil pengguna.

paths:
  /api/most-liked:
    get:
      summary: Get Most Liked Recipes
      description: Mengambil daftar resep terpopuler berdasarkan jumlah resep yang paling banyak disukai untuk beranda.
      tags:
        - Modul Pencarian & Katalog Resep
      responses:
        '200':
          description: Berhasil mendapatkan resep terpopuler
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil dapet resep terpopuler
                  data:
                    type: object
                    properties:
                      recipes:
                        type: array
                        items:
                          type: object
        '500':
          $ref: '#/components/responses/ServerError'

  /api/search-bahan:
    get:
      summary: Search Recipes by Ingredients
      description: Mencari resep berdasarkan bahan makanan yang tersedia di dapur.
      tags:
        - Modul Pencarian & Katalog Resep
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Kata kunci / nama bahan
      responses:
        '200':
          description: Berhasil mencari resep berdasarkan bahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil mencari resep berdasarkan bahan
                  data:
                    type: object
                    properties:
                      recipes:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/search-resep:
    get:
      summary: Search Recipes by Name
      description: Mencari resep secara langsung berdasarkan nama atau kata kunci resep.
      tags:
        - Modul Pencarian & Katalog Resep
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Kata kunci pencarian
      responses:
        '200':
          description: Berhasil mencari resep
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil mencari resep
                  data:
                    type: object
                    properties:
                      recipes:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/filter:
    get:
      summary: Filter Recipes
      description: Menyaring resep berdasarkan pilihan kriteria alergi dan preferensi rasa pedas.
      tags:
        - Modul Pencarian & Katalog Resep
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: Kriteria filter (misal alergi telur/seafood atau bebas pedas)
      responses:
        '200':
          description: Berhasil memfilter resep
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil memfilter resep
                  data:
                    type: object
                    properties:
                      recipes:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/recipes/{id}:
    get:
      summary: Get Recipe Detail
      description: Menampilkan detail lengkap sebuah resep (porsi, status bahan, langkah-langkah).
      tags:
        - Modul Detail & Interaksi Resep
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID resep
      responses:
        '200':
          description: Berhasil mengambil detail resep
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil mengambil detail resep
                  data:
                    type: object
                    properties:
                      recipe:
                        type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/recipes/{id}/bookmark:
    post:
      summary: Add Bookmark
      description: Menyimpan resep ke daftar favorit pengguna (membutuhkan Bearer Token).
      tags:
        - Modul Detail & Interaksi Resep
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID resep
      responses:
        '200':
          description: Berhasil menyimpan resep ke bookmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete Bookmark
      description: Menghapus resep dari daftar simpanan favorit (membutuhkan Bearer Token).
      tags:
        - Modul Detail & Interaksi Resep
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID resep
      responses:
        '200':
          description: Berhasil menghapus resep dari bookmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/register:
    post:
      summary: Register
      description: Mendaftarkan akun baru pengguna secara manual (Nama, Email, Password).
      tags:
        - Modul Autentikasi Pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Ayes
                email:
                  type: string
                  format: email
                  example: ayes@example.com
                password:
                  type: string
                  format: password
                  example: rahasia123
      responses:
        '201':
          description: Berhasil membuat akun
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil membuat akun
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1Ni...
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/login:
    post:
      summary: Login
      description: Masuk ke dalam sistem dan mendapatkan JWT access token.
      tags:
        - Modul Autentikasi Pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: ayes@example.com
                password:
                  type: string
                  format: password
                  example: rahasia123
      responses:
        '200':
          description: Berhasil login
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil login
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1Ni...
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Email / password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/google:
    post:
      summary: Google Login
      description: Masuk menggunakan kredensial Google (Social Login).
      tags:
        - Modul Autentikasi Pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: google_id_token_string
      responses:
        '200':
          description: Berhasil login dengan Google
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil login dengan Google
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1Ni...
        '400':
          description: Token Google tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/logout:
    post:
      summary: Logout
      description: Keluar dari sistem dan membersihkan sesi pengguna.
      tags:
        - Modul Autentikasi Pengguna
      responses:
        '200':
          description: Berhasil logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/user/profile:
    get:
      summary: Get User Profile
      description: Mengambil data profil pengguna yang sedang login.
      tags:
        - Modul Profil Pengguna
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Berhasil mengambil profil pengguna
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: berhasil mengambil profil pengguna
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          name:
                            type: string
                            example: Ayes
                          email:
                            type: string
                            example: ayes@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BasicSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: berhasil
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: failed
        message:
          type: string
          example: Terjadi kesalahan pada sistem
    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: failed
        message:
          type: string
          example: validasi gagal
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: bahan
              message:
                type: string
                example: bahan minimal 1 dipilih

  responses:
    Unauthorized:
      description: Tidak terautentikasi (Token tidak ada atau tidak valid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validasi input gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ServerError:
      description: Kesalahan internal server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'