name: Deploy to VPS

on:
  push:
    branches:
      - main # Otomatis jalan saat ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/nama-folder-project
            git pull origin main
            # Tambahkan perintah restart service di bawah ini, contoh:
            # pm2 restart all
            # atau: sudo systemctl restart nama-service