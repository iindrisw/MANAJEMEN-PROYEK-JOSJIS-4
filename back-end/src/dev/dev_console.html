<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Racik Rasa – Dev Console</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:900px;margin:16px auto;padding:0 12px;background:#fff8e1;color:#222}
 fieldset{border:1px solid #d9b95b;border-radius:8px;margin:12px 0;background:#fff}
 legend{font-weight:700} input{padding:6px;margin:2px} button{padding:6px 10px;margin:2px;cursor:pointer}
 .card{border:1px solid #ddd;border-radius:8px;padding:8px;margin:6px 0;background:#fffdf5}
 .muted{color:#777;font-size:12px} .ok{color:#0a7d32} .err{color:#c0392b}
 pre{background:#f4f4f4;padding:8px;overflow:auto;max-height:200px;font-size:12px}
 #step{font-size:20px;padding:24px;border:2px solid #d9534f;border-radius:12px;background:#ffeab0;min-height:120px}
</style></head><body>
<h2>Racik Rasa – Dev Console <span class="muted">(hanya aktif saat FLASK_DEBUG=true)</span></h2>
<div>Status login: <b id="who" class="err">belum login</b> <button onclick="logout()">Logout</button></div>

<fieldset><legend>1. Register / Login</legend>
 <input id="nama" placeholder="nama"> <input id="email" placeholder="email"> <input id="pw" type="password" placeholder="password (min 8)">
 <button onclick="auth('register')">Register</button> <button onclick="auth('login')">Login</button><br>
 <input id="gtoken" placeholder="id_token Google (opsional)" size="40"> <button onclick="googleLogin()">Login Google</button>
</fieldset>

<fieldset><legend>2. Cari kombinasi bahan</legend>
 Utama (1): <input id="utama" value="ayam" size="10"> Tambahan (maks 5, pisah koma): <input id="tambahan" value="cabe, kacang, bawang, tahu" size="32">
 <button onclick="cari(1)">Racik!</button> <span id="info" class="muted"></span>
 <div id="hasil"></div><div id="paging"></div>
</fieldset>

<fieldset><legend>3. Milik saya</legend>
 <button onclick="milik('likes')">Resep di-like</button> <button onclick="milik('bookmarks')">Resep disimpan</button><div id="milik"></div>
</fieldset>

<fieldset><legend>4. Mode memasak</legend>
 <div id="cookhead" class="muted">Klik “Masak” di salah satu resep.</div>
 <div id="step"></div>
 <button onclick="geser(-1)">◀ Sebelumnya</button> <span id="nomor"></span> <button onclick="geser(1)">Berikutnya ▶</button>
</fieldset>

<fieldset><legend>Respons terakhir (JSON mentah)</legend><pre id="raw"></pre></fieldset>

<script>
let token = null, steps = [], idx = 0;
const $ = id => document.getElementById(id);
const el = (t, props = {}, ...kids) => { const e = document.createElement(t); Object.assign(e, props); kids.forEach(k => e.append(k)); return e; };

async function api(method, path, body) {
  const h = {'Content-Type': 'application/json'}; if (token) h.Authorization = 'Bearer ' + token;
  const r = await fetch(path, {method, headers: h, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); $('raw').textContent = method + ' ' + path + '  ->  ' + r.status + '\n' + JSON.stringify(j, null, 2);
  return {ok: r.ok, status: r.status, data: j};
}
function setUser(d) { token = d.token; $('who').textContent = d.user.nama + ' (' + d.user.email + ', ' + d.user.auth_provider + ')'; $('who').className = 'ok'; }
function logout() { token = null; $('who').textContent = 'belum login'; $('who').className = 'err'; }
async function auth(mode) {
  const body = {email: $('email').value, password: $('pw').value}; if (mode === 'register') body.nama = $('nama').value;
  const r = await api('POST', '/api/auth/' + mode, body); if (r.ok) setUser(r.data);
}
async function googleLogin() { const r = await api('POST', '/api/auth/google', {id_token: $('gtoken').value}); if (r.ok) setUser(r.data); }

function kartu(x) {
  const bahan = (x.bahan_terpakai || []).slice(0, 4).map(b => b.nama_bahan).join(', ');
  const box = el('div', {className: 'card'});
  box.append(el('b', {textContent: x.nama_resep}), el('span', {className: 'muted', textContent: '  ♥ ' + x.jumlah_like}));
  if (x.label_kombinasi) box.append(el('div', {className: 'ok', textContent: x.label_kombinasi + (x.bahan_kurang.length ? '   (kurang: ' + x.bahan_kurang.join(', ') + ')' : '   ✓ lengkap')}));
  box.append(el('div', {className: 'muted', textContent: bahan}));
  const lk = el('button', {textContent: x.sudah_like ? '♥ Unlike' : '♡ Like'});
  lk.onclick = async () => { const r = await api(x.sudah_like ? 'DELETE' : 'POST', `/api/recipes/${x.id_resep}/like`); if (r.ok) { x.sudah_like = r.data.sudah_like; x.jumlah_like = r.data.jumlah_like; box.replaceWith(kartu(x)); } };
  const bm = el('button', {textContent: x.sudah_simpan ? '★ Hapus simpan' : '☆ Simpan'});
  bm.onclick = async () => { const r = await api(x.sudah_simpan ? 'DELETE' : 'POST', `/api/recipes/${x.id_resep}/bookmark`); if (r.ok) { x.sudah_simpan = r.data.sudah_simpan; box.replaceWith(kartu(x)); } };
  const dt = el('button', {textContent: 'Detail'}); dt.onclick = () => api('GET', `/api/recipes/${x.id_resep}`);
  const ms = el('button', {textContent: '🍳 Masak'}); ms.onclick = () => masak(x.id_resep);
  box.append(el('div', {}, lk, bm, dt, ms));
  return box;
}
function tampil(target, data) { target.replaceChildren(...(data.length ? data.map(kartu) : [el('i', {textContent: 'Tidak ada hasil.'})])); }

async function cari(page) {
  const q = new URLSearchParams({utama: $('utama').value, tambahan: $('tambahan').value, page});
  const r = await api('GET', '/api/recipes/search?' + q);
  if (!r.ok) { $('info').textContent = '❌ ' + r.data.message; $('info').className = 'err'; $('hasil').replaceChildren(); $('paging').replaceChildren(); return; }
  const d = r.data; $('info').className = 'muted';
  $('info').textContent = `${d.total_ditemukan} resep | tingkat: ` + d.kombinasi.map(k => `${k.jumlah_cocok}cocok=${k.total_resep}`).join(', ') + (d.bahan_tambahan_tidak_dikenal.length ? ' | tidak dikenal: ' + d.bahan_tambahan_tidak_dikenal.join(', ') : '');
  tampil($('hasil'), d.data);
  const prev = el('button', {textContent: '◀'}), next = el('button', {textContent: '▶'});
  prev.disabled = d.halaman <= 1; next.disabled = d.halaman >= d.total_halaman;
  prev.onclick = () => cari(d.halaman - 1); next.onclick = () => cari(d.halaman + 1);
  $('paging').replaceChildren(prev, ` hal ${d.halaman}/${d.total_halaman} `, next);
}
async function milik(jenis) { const r = await api('GET', '/api/users/me/' + jenis); if (r.ok) tampil($('milik'), r.data.data); else $('milik').textContent = '❌ ' + r.data.message; }

async function masak(id) {
  const r = await api('GET', `/api/recipes/${id}/cooking-mode`); if (!r.ok) return;
  steps = r.data.data.langkah; idx = 0; $('cookhead').textContent = r.data.data.nama_resep + ' – ' + steps.length + ' langkah'; render();
}
function geser(d) { if (!steps.length) return; idx = Math.min(Math.max(idx + d, 0), steps.length - 1); render(); }
function render() {
  const s = steps[idx]; $('nomor').textContent = `Langkah ${s.nomor} / ${s.total}`;
  $('step').replaceChildren(el('div', {textContent: s.teks}), ...(s.timer_menit ? [el('div', {className: 'muted', textContent: '⏱ timer disarankan: ' + s.timer_menit + ' menit'})] : []), ...(s.is_terakhir ? [el('b', {textContent: '🎉 Selesai!'})] : []));
}
</script></body></html>
